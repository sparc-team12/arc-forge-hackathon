name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/arc-forge-hackathon
            git pull origin main
            cd application/issue-tracker/mcp-issue-tracker/backend
            npm install
            cd ../frontend
            npm install
            npx vite build
            cd ..
            sudo systemctl restart myapp